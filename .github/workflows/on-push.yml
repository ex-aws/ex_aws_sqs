name: on-push
on: [push, pull_request]
env:
  MIX_ENV: test
jobs:
  build:
    runs-on: ubuntu-24.04
    services:
      elasticmq:
        image: softwaremill/elasticmq
        ports:
          - 9324:9324
    # See https://hexdocs.pm/elixir/compatibility-and-deprecations.html#compatibility-between-elixir-and-erlang-otp
    strategy:
      matrix:
        include:
          - pair:
              otp: "29"
              elixir: "1.20"
              lint: lint

          - pair:
              otp: "28"
              elixir: "1.19"
          - pair:
              otp: "27"
              elixir: "1.19"

          - pair:
              otp: "28"
              elixir: "1.18"
          - pair:
              otp: "27"
              elixir: "1.18"
          - pair:
              otp: "27"
              elixir: "1.17"

          - pair:
              otp: "26"
              elixir: "1.17"
          - pair:
              otp: "26"
              elixir: "1.16"
          - pair:
              otp: "26"
              elixir: "1.15"

    steps:
      - uses: actions/checkout@v6
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{matrix.pair.otp}}
          elixir-version: ${{matrix.pair.elixir}}
      - uses: actions/cache@v5
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{matrix.pair.otp}}-${{matrix.pair.elixir}}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{matrix.pair.otp}}-${{matrix.pair.elixir}}-

      - run: mix deps.get

      - run: mix compile --warnings-as-errors

      - run: mix deps.unlock --check-unused
        if: ${{ matrix.pair.lint }}

      - run: mix format --check-formatted
        if: ${{ matrix.pair.lint }}

      - run: mix dialyzer
        if: ${{ matrix.pair.lint }}

      - run: mix test --include external:true
